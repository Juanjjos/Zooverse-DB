{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | ZooVerse{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        html,
        html[data-theme="dark"],
        html[data-theme="auto"] {
            color-scheme: light !important;
        }

        :root {
            --zoo-forest: #174b37;
            --zoo-forest-dark: #103a2b;
            --zoo-leaf: #28714d;
            --zoo-mist: #f2f6f1;
            --zoo-line: #dce7dc;
        }

        body {
            background: var(--zoo-mist) !important;
            color: #20352a !important;
        }

        #container,
        #content {
            background: var(--zoo-mist) !important;
            color: #20352a !important;
        }

        #header {
            padding: 14px 28px;
            background: linear-gradient(110deg, var(--zoo-forest-dark), var(--zoo-forest) 65%, #286247);
            box-shadow: 0 3px 14px #0e332524;
        }

        #branding h1,
        #branding h1 a:link,
        #branding h1 a:visited {
            color: #fffdf5;
            font-size: 19px;
            font-weight: 750;
            letter-spacing: .01em;
        }

        #branding h1::before {
            margin-right: 10px;
            content: "🐾";
        }

        #user-tools {
            color: #e6f0e5;
            font-size: 12px;
            letter-spacing: .025em;
        }

        #user-tools a:link,
        #user-tools a:visited {
            color: #e4efbc;
            border-bottom-color: #e4efbc66;
        }

        #user-tools a:hover {
            color: white;
        }

        #nav-sidebar {
            border-right: 1px solid var(--zoo-line);
            background: #fbfcf8;
        }

        #nav-sidebar .current-model {
            background: #e7f0e5;
        }

        #content {
            padding-top: 24px;
        }

        #content h1 {
            color: var(--zoo-forest-dark);
            font-size: 26px;
            font-weight: 700;
        }

        .module,
        .inline-group,
        .submit-row,
        .paginator {
            overflow: hidden;
            border: 1px solid var(--zoo-line);
            border-radius: 12px;
            background: #fffefa;
            box-shadow: 0 5px 18px #183d2609;
        }

        .module h2,
        .module caption,
        .inline-group h2 {
            background: var(--zoo-forest);
            color: white;
            font-weight: 650;
        }

        .module table th,
        .module table td {
            padding: 10px 12px;
        }

        .row1 {
            background: #fffefa;
        }

        .row2 {
            background: #f5f8f2;
        }

        .button,
        input[type="submit"],
        input[type="button"],
        .submit-row input,
        a.button {
            border: 0;
            border-radius: 7px;
            background: var(--zoo-leaf);
            box-shadow: none;
            font-weight: 650;
        }

        .button:hover,
        input[type="submit"]:hover,
        input[type="button"]:hover,
        .submit-row input:hover,
        a.button:hover {
            background: var(--zoo-forest-dark);
        }

        .object-tools a:link,
        .object-tools a:visited {
            border-radius: 7px;
            background: var(--zoo-leaf);
        }

        .messagelist li {
            border-radius: 8px;
        }

        .login #content {
            box-sizing: border-box;
            width: 100%;
            margin: 0;
            padding: 18px !important;
            background: transparent !important;
        }

        .login #content-main {
            box-sizing: border-box;
            width: 100%;
            margin: 0;
            padding: 24px;
            border: 1px solid var(--zoo-line);
            border-radius: 14px;
            background: #fffefa !important;
            box-shadow: 0 12px 32px #183d2614;
            color: #20352a !important;
        }

        .login #content-main form {
            box-sizing: border-box;
            width: 100%;
        }

        .login #content-main label,
        .login #content-main .password-reset-link {
            color: #40564a !important;
        }

        .login #content-main input[type="text"],
        .login #content-main input[type="password"] {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid #bdcdbd;
            border-radius: 6px;
            background: white !important;
            color: #20352a !important;
        }

        .login .submit-row {
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        @media (max-width: 767px) {
            #header {
                padding: 12px 16px;
            }

            #user-tools {
                line-height: 1.8;
            }
        }
    </style>
{% endblock %}

{% block branding %}
    <h1 id="site-name"><a href="{% url 'admin:index' %}">ZooVerse · Centro de gestión</a></h1>
{% endblock %}
